# Fly.io app config. `app` must be globally unique across all of Fly — if
# "agc-launcher-server" is taken, pick another name here AND update
# src/AGC.Launcher.Core/Services/Http/ApiConfig.cs (Release BaseUrl) to match.
app = 'agc-launcher-server'
primary_region = 'iad'

[build]

# Persistent disk for the SQLite database and uploaded game builds/thumbnails —
# without this, both would be wiped on every deploy. Created once with
# `fly volumes create agc_data --size 1 --region iad`.
[mounts]
  source = 'agc_data'
  destination = '/data'

[env]
  SQLITE_DB_PATH = '/data/agc.db'
  STORAGE_ROOT = '/data/storage'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # 0 = scale to zero when idle (cheapest for low-traffic indie use, at the cost of a
  # few seconds' cold start on the first request after idle). Set to 1 to keep a
  # machine warm and avoid that, at a small extra monthly cost.
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
